<style>
/* App guiado: trilha de aulas na tela inicial; cada aula é uma sequência de telas com uma ação por vez e botão grande fixo embaixo. Cada corda tem sua cor em todo o app. */
:root {
  --bg: #f5f3fa;
  --card: #ffffff;
  --ink: #1d1a26;
  --ink-2: #4a4458;
  --muted: #736d83;
  --line: #e3dfec;
  --accent: #5b34a0;
  --accent-deep: #3e2275;
  --accent-ink: #ffffff;
  --accent-soft: #ece6f7;
  --gold: #f2b705;
  --gold-deep: #b88600;
  --gold-ink: #2b1f00;
  --good: #2b8a3e;
  --good-soft: #e3f4e6;
  --bad: #c92a2a;
  --c0: #e03131; --c1: #c77d00; --c2: #2f9e44; --c3: #1971c2;
  --c0-soft: #ffe8e8; --c1-soft: #fff1d6; --c2-soft: #e3f6e7; --c3-soft: #e3effb;
  --staff: #8d879b;
  --board: #2a2532;
  --string-dim: #5f586c;
  --dot-ink: #ffffff;
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15131b; --card: #1f1c27; --ink: #f0edf6; --ink-2: #cfc9da; --muted: #a29cb0; --line: #34303f;
    --accent: #b196ef; --accent-deep: #7253b8; --accent-ink: #160f24; --accent-soft: #2b2440;
    --gold: #ffd43b; --gold-deep: #c9a000; --gold-ink: #2b1f00;
    --good: #69db7c; --good-soft: #1d3324; --bad: #ff8787;
    --c0: #ff8787; --c1: #ffc14d; --c2: #69db7c; --c3: #74c0fc;
    --c0-soft: #3a2024; --c1-soft: #3a2f16; --c2-soft: #1c3323; --c3-soft: #182c3f;
    --staff: #7d778b; --board: #0e0c12; --string-dim: #4d4758; --dot-ink: #15131b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15131b; --card: #1f1c27; --ink: #f0edf6; --ink-2: #cfc9da; --muted: #a29cb0; --line: #34303f;
  --accent: #b196ef; --accent-deep: #7253b8; --accent-ink: #160f24; --accent-soft: #2b2440;
  --gold: #ffd43b; --gold-deep: #c9a000; --gold-ink: #2b1f00;
  --good: #69db7c; --good-soft: #1d3324; --bad: #ff8787;
  --c0: #ff8787; --c1: #ffc14d; --c2: #69db7c; --c3: #74c0fc;
  --c0-soft: #3a2024; --c1-soft: #3a2f16; --c2-soft: #1c3323; --c3-soft: #182c3f;
  --staff: #7d778b; --board: #0e0c12; --string-dim: #4d4758; --dot-ink: #15131b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 18px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; -webkit-user-select: none; user-select: none; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
svg { display: block; }
.s0 { --sc: var(--c0); --ss: var(--c0-soft); }
.s1 { --sc: var(--c1); --ss: var(--c1-soft); }
.s2 { --sc: var(--c2); --ss: var(--c2-soft); }
.s3 { --sc: var(--c3); --ss: var(--c3-soft); }

/* Botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 58px; padding: 12px 24px; border-radius: 18px; border: 0; cursor: pointer;
  font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; line-height: 1;
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn svg { width: 24px; height: 24px; flex: none; }
.btn:active { transform: translateY(3px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 5px 0 var(--accent-deep); }
.btn.primary:active { box-shadow: 0 2px 0 var(--accent-deep); }
.btn.gold { background: var(--gold); color: var(--gold-ink); box-shadow: 0 5px 0 var(--gold-deep); }
.btn.gold:active { box-shadow: 0 2px 0 var(--gold-deep); }
.btn.soft { background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--line), inset 0 0 0 2px var(--line); }
.btn.soft:active { box-shadow: 0 1px 0 var(--line), inset 0 0 0 2px var(--line); }
.btn.wide { width: 100%; }
.btn[disabled] { background: var(--line); color: var(--muted); box-shadow: none; cursor: default; transform: none; }
.btn.nudge:not([disabled]) { animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

.icon-btn {
  width: 48px; height: 48px; border-radius: 14px; border: 0; background: var(--card);
  box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn svg { width: 24px; height: 24px; }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); }

/* Tela inicial */
.home { padding-block: 28px 40px; }
.eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.home h1 { font-size: clamp(2.2rem, 9vw, 3rem); margin-top: 4px; }
.stars-pill {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 6px 14px 6px 10px;
  border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; color: var(--ink-2);
}
.stars-pill svg { width: 24px; height: 24px; fill: var(--gold); }
.stars-pill b { color: var(--ink); font-variant-numeric: tabular-nums; }

.install-slot:empty { display: none; }
.install-slot { margin-top: 16px; }
.install-hint { font-size: 1rem; font-weight: 600; color: var(--ink-2); background: var(--accent-soft); border-radius: 16px; padding: 12px 14px; }
.next-card {
  margin-top: 22px; padding: 20px; border-radius: 24px; background: var(--card);
  box-shadow: inset 0 0 0 2px var(--line), 0 6px 0 var(--line); display: grid; gap: 16px;
}
.next-card .label { font-size: 14px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.next-row { display: flex; align-items: center; gap: 16px; }
.next-row .kick { font-weight: 700; color: var(--muted); font-size: 1rem; }
.next-row .ttl { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; line-height: 1.1; }

.trail { margin-top: 30px; }
.trail h2 { font-size: 1.35rem; margin: 26px 0 8px; color: var(--ink-2); }
.trail ol { list-style: none; margin: 0; padding: 0; position: relative; }
.trail ol::before { content: ""; position: absolute; left: 31px; top: 30px; bottom: 30px; width: 4px; border-radius: 2px; background: var(--line); }
.trail li + li { margin-top: 8px; }
.t-item {
  position: relative; width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
  background: none; border: 0; padding: 4px 8px 4px 0; border-radius: 18px; cursor: pointer;
}
.t-item:hover .t-txt b { color: var(--accent); }
.t-txt { display: grid; min-width: 0; }
.t-txt small { font-size: 0.9rem; font-weight: 700; color: var(--muted); }
.t-txt b { font-size: 1.12rem; font-weight: 800; line-height: 1.2; }

.node {
  position: relative; width: 66px; height: 66px; flex: none; border-radius: 50%;
  display: grid; place-items: center; background: var(--card); color: var(--ink-2);
  box-shadow: inset 0 0 0 3px var(--line), 0 4px 0 var(--line);
  font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; line-height: 1;
}
.node svg { width: 28px; height: 28px; }
.node.done { background: var(--gold); color: var(--gold-ink); box-shadow: 0 4px 0 var(--gold-deep); }
.node.next { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-deep), 0 0 0 6px var(--accent-soft); }
.node .badge {
  position: absolute; right: -4px; bottom: -4px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--card); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--gold-deep);
}
.node .badge svg { width: 17px; height: 17px; fill: var(--gold-deep); }

.h-foot { margin-top: 40px; padding-top: 18px; border-top: 2px solid var(--line); display: grid; gap: 12px; font-size: 15px; color: var(--muted); }
.link-btn { justify-self: start; background: none; border: 0; padding: 6px 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 15px; }
.link-btn.armed { color: var(--bad); font-weight: 800; }

/* Tela de aula */
.l-top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 12px; padding-block: 10px;
}
.dots { flex: 1; display: flex; justify-content: center; gap: 8px; }
.dots i { width: 100%; max-width: 54px; height: 10px; border-radius: 5px; background: var(--line); }
.dots i.on { background: var(--accent); }
.dots i.past { background: var(--accent); opacity: .45; }
.l-body { padding-block: 10px 28px; display: grid; gap: 18px; animation: enter .28s ease-out; }
@keyframes enter { from { opacity: .35; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.l-kick { font-weight: 800; color: var(--accent); font-size: 1rem; }
.l-title { font-size: clamp(1.9rem, 8vw, 2.4rem); }
.say { font-size: 1.2rem; color: var(--ink-2); max-width: 32ch; }
.l-foot {
  position: sticky; bottom: 0; z-index: 5; background: var(--bg); border-top: 2px solid var(--line);
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
}
.l-foot .wrap { display: flex; gap: 12px; padding-block: 12px 4px; }
.l-foot .back { flex: 0 0 auto; padding-inline: 18px; }
.l-foot .go { flex: 1; }

.tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.tips li { display: flex; gap: 12px; align-items: flex-start; font-size: 1.22rem; font-weight: 600; }
.tips li::before { content: ""; flex: none; width: 14px; height: 14px; margin-top: 9px; border-radius: 50%; background: var(--accent); }

.board-card { background: var(--card); border-radius: 22px; padding: 14px 14px 10px; box-shadow: inset 0 0 0 2px var(--line); }
.board { width: 100%; max-width: 300px; height: auto; margin: 0 auto; }
.board .b-lab { font: 800 17px var(--f-display); text-anchor: middle; fill: var(--sc); }
.board .b-lab.dim { fill: var(--muted); }
.board .b-bd { fill: var(--board); }
.board .b-nut { fill: var(--ink); }
.board .b-str { stroke: var(--sc); }
.board .b-str.dim { stroke: var(--string-dim); }
.board .b-dot { fill: var(--sc); }
.board .b-num { font: 800 15px var(--f-body); fill: var(--dot-ink); text-anchor: middle; }
.board .b-open { fill: none; stroke: var(--sc); stroke-width: 2.4; }
.board .b-open-t { font: 800 12px var(--f-body); fill: var(--sc); text-anchor: middle; }
.board-cap { text-align: center; font-size: 15px; color: var(--muted); margin-top: 6px; }

/* Partitura e controles */
.player { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.bigplay {
  width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer; flex: none;
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 0 var(--accent-deep);
  display: grid; place-items: center; transition: transform .08s;
}
.bigplay svg { width: 38px; height: 38px; fill: currentColor; }
.bigplay:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--accent-deep); }
.bigplay[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: 0 6px 0 var(--muted); }
.bigplay.beat { transform: scale(1.07); }
.play-lab { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; line-height: 1.1; }
.play-lab small { display: block; font-family: var(--f-body); font-weight: 600; font-size: 0.95rem; color: var(--muted); }
.speed { display: inline-flex; padding: 4px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); }
.speed button { border: 0; background: none; padding: 10px 16px; border-radius: 12px; font-weight: 800; cursor: pointer; color: var(--muted); }
.speed button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.sheet { background: var(--card); border-radius: 22px; padding: 14px 10px 6px; box-shadow: inset 0 0 0 2px var(--line); }
.score { overflow-x: auto; }
.score .sl { stroke: var(--staff); stroke-width: 1; }
.score .bl { stroke: var(--ink); stroke-width: 1.1; }
.score .ink { fill: var(--ink); }
.score .clef path { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
.score .acc line { stroke: var(--ink); stroke-width: 1.1; }
.score .ts { font-family: var(--f-display); font-weight: 800; font-size: 24px; fill: var(--ink); text-anchor: middle; }
.score .n .hd { fill: var(--sc, var(--ink)); }
.score .n .hd.o { fill: none; stroke: var(--sc, var(--ink)); stroke-width: 2; }
.score .n .hd.w { stroke-width: 2.4; }
.score .st, .score .lg { stroke: var(--ink); stroke-width: 1.3; }
.score .fl, .score .dt, .score .slur { fill: var(--ink); }
.score .fg { font: 800 12.5px var(--f-body); fill: var(--sc, var(--ink-2)); text-anchor: middle; }
.score .bw { fill: var(--ink-2); }
.score .bw.u { fill: none; stroke: var(--ink-2); stroke-width: 1.4; stroke-linejoin: round; }
.score .nm { font: 700 11.5px var(--f-body); fill: var(--sc, var(--muted)); text-anchor: middle; }
.score .halo { fill: var(--sc, var(--accent)); opacity: 0; transition: opacity .08s; }
.score .n.on .halo { opacity: .28; }
.score .n.on .nm { font-weight: 800; font-size: 13px; }

.count { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; pointer-events: none; }
.count span {
  width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font: 800 64px/1 var(--f-display);
  box-shadow: 0 8px 0 var(--accent-deep); animation: pop .25s ease-out;
}
@keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }

/* Afinador e jogo */
.strings4 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.str-btn {
  border: 0; border-radius: 22px; padding: 18px 10px 14px; cursor: pointer; display: grid; gap: 2px; justify-items: center;
  background: var(--ss); color: var(--ink); box-shadow: inset 0 0 0 3px var(--sc), 0 5px 0 var(--sc);
  transition: transform .08s;
}
.str-btn:active { transform: translateY(3px); box-shadow: inset 0 0 0 3px var(--sc), 0 2px 0 var(--sc); }
.str-btn b { font-family: var(--f-display); font-size: 2.1rem; line-height: 1; color: var(--sc); }
.str-btn span { font-size: 0.95rem; font-weight: 700; color: var(--ink-2); }
.str-btn[aria-pressed="true"] { animation: ring 1s ease-in-out infinite; }
@keyframes ring { 0%, 100% { box-shadow: inset 0 0 0 3px var(--sc), 0 5px 0 var(--sc), 0 0 0 0 var(--sc); } 50% { box-shadow: inset 0 0 0 3px var(--sc), 0 5px 0 var(--sc), 0 0 0 8px var(--ss); } }
.str-btn.right { background: var(--good-soft); box-shadow: inset 0 0 0 3px var(--good), 0 5px 0 var(--good); }
.str-btn.wrong { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.quiz-sheet { display: grid; justify-items: center; }
.quiz-sheet .score { width: 100%; max-width: 280px; }
.quiz-msg { min-height: 1.6em; text-align: center; font-weight: 800; font-size: 1.2rem; }
.quiz-msg.ok { color: var(--good); }
.quiz-msg.no { color: var(--bad); }
.rounds { display: flex; justify-content: center; gap: 8px; }
.rounds i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); }
.rounds i.done { background: var(--good); }

/* Checklist e sinais */
.checks { display: grid; gap: 12px; }
.check {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer;
  border: 0; border-radius: 20px; padding: 14px 16px; background: var(--card);
  box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--line); font-weight: 700; font-size: 1.12rem; line-height: 1.3;
}
.check .box { width: 40px; height: 40px; flex: none; border-radius: 12px; box-shadow: inset 0 0 0 3px var(--line); display: grid; place-items: center; color: transparent; }
.check .box svg { width: 26px; height: 26px; }
.check.with-ill { padding: 10px 14px 10px 10px; }

  function bindPlayer(ex, mode, o) {
    const el = document.getElementById('score');
    drawScore(el, ex, o || {});
    const btn = document.getElementById('bigplay');
    btn.addEventListener('click', () => play(el, mode, btn, () => {
      const go = document.getElementById('go');
      if (go) go.classList.add('nudge');
    }));
  }

  function bindQuiz() {
    const el = document.getElementById('score');
    const msg = document.getElementById('qmsg');
    const dots = [...document.querySelectorAll('#rounds i')];
    const order = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
    const notes = ['C3', 'G3', 'D4', 'A4'];
    let r = 0, locked = false;
    const show = () => drawScore(el, { key: 'C', meter: '4/4', showTime: false, perLine: 1, notes: notes[order[r]] + 'w' }, { fing: false, names: false, neutral: true, scale: 1.7 });
    show();
    app.querySelectorAll('.strings4 .str-btn').forEach(b => b.addEventListener('click', () => {
      if (locked) return;
      const s = +b.dataset.s;
      if (s === order[r]) {
        locked = true;
        b.classList.add('right'); dots[r].classList.add('done');
        msg.className = 'quiz-msg ok'; msg.textContent = r < 3 ? 'Isso! Muito bem.' : 'Acertou todas!';
        try { audio(); const bag = []; voice(STR_MIDI[s], ctx.currentTime + 0.02, 0.8, false, bag); } catch (e) {}
        setTimeout(() => {
          if (!document.body.contains(b)) return;
          b.classList.remove('right'); locked = false; r++;
          if (r >= 4) { celebrate(); return; }
          msg.className = 'quiz-msg'; msg.textContent = ''; show();
        }, 1000);
      } else {
        b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
        msg.className = 'quiz-msg no'; msg.textContent = 'Quase! Tente de novo.';
      }
    }));
  }

  function celebrate(grade) {
    const it = TRAIL[cur.i];
    stopEverything();
    stars.add(it.id); saveStars();
    if (grade) { grades[it.id] = Math.max(grades[it.id] || 0, grade); saveGrades(); }
    const ni = nextIndex(cur.i + 1);
    const art = grade
      ? `<div class="r-stars big">${starsRow(grade)}</div>`
      : `<svg class="big-star" viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR_D}"/></svg>`;
    const msg = ni < 0 ? 'Você completou todas as aulas! Continue treinando as músicas.'
      : grade ? `Você tirou <b>${grade} ${grade === 1 ? 'estrela' : 'estrelas'}</b> em ${it.title}.`
      : `Você completou <b>${it.title}</b>.`;
    app.innerHTML = `
      <main class="celebrate wrap">
        ${art}
        <h1>${grade === 3 ? 'Perfeito!' : 'Muito bem!'}</h1>
        <p>${msg}</p>
        <div class="stars-pill">${I.star}<span><b>${stars.size}</b> de ${TRAIL.length} aulas feitas</span></div>
        <div class="btns">
          ${ni >= 0 ? `<button class="btn primary wide nudge" type="button" id="nextL">Próxima aula ${I.arrow}</button>` : ''}
          <button class="btn soft wide" type="button" id="toTrail">Ver a trilha</button>
        </div>
      </main>`;
    window.scrollTo(0, 0);
    fanfare();
    if (ni >= 0) document.getElementById('nextL').addEventListener('click', () => openLesson(ni));
    document.getElementById('toTrail').addEventListener('click', closeLesson);
  }

  // ---------- Início ----------
  let rt = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      app.querySelectorAll('.score').forEach(el => {
        if (!el._ex || (playing && playing.scoreEl === el)) return;
        if (Math.abs(Math.floor(el.clientWidth) - el._w) > 12) drawScore(el, el._ex, el._o);
      });
    }, 180);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
    app.querySelectorAll('.score').forEach(el => { if (el._ex && !(playing && playing.scoreEl === el)) drawScore(el, el._ex, el._o); });
  });
  if (location.hash === '#aula') { try { location.hash = 'trilha'; } catch (e) {} }
  renderHome();
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
